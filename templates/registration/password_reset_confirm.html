{% extends "base.html" %}
{% block title %}Set a new password · To-Do List{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <h1>Set a new password</h1>
  {% if validlink %}
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary-btn full-width" type="submit">Save new password</button>
  </form>
  {% else %}
  <p class="muted">This password reset link is invalid or has expired.</p>
  <p class="auth-footer"><a href="{% url 'password_reset' %}">Request a new link</a></p>
  {% endif %}
</div>
{% endblock %}
