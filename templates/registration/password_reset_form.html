{% extends "base.html" %}
{% block title %}Reset password · To-Do List{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your email and we'll send you reset instructions (requires email backend configuration).</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary-btn full-width" type="submit">Send reset link</button>
  </form>
  <p class="auth-footer"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
