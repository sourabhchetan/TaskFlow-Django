{% comment %}
Reusable empty-state illustration: a checklist card with sparkles and a plus
badge. Pure inline SVG using design-system colors via currentColor/CSS vars,
so it themes correctly and adds no page weight.
{% endcomment %}
<div class="empty-illustration" aria-hidden="true">
  <svg viewBox="0 0 120 96" width="120" height="96" fill="none">
    <!-- sparkles -->
    <path class="ei-spark" d="M18 40l1.6 3.6L23 45l-3.4 1.4L18 50l-1.6-3.6L13 45l3.4-1.4z"/>
    <path class="ei-spark" d="M101 34l1.2 2.7 2.8 1.1-2.8 1.1-1.2 2.7-1.2-2.7-2.8-1.1 2.8-1.1z"/>
    <path class="ei-spark" d="M96 62l1 2.2 2.3.9-2.3.9-1 2.2-1-2.2-2.3-.9 2.3-.9z"/>
    <!-- checklist card -->
    <rect class="ei-card" x="38" y="20" width="44" height="56" rx="7"/>
    <!-- rows -->
    <rect class="ei-box" x="46" y="31" width="7" height="7" rx="2"/>
    <line class="ei-line" x1="58" y1="34.5" x2="73" y2="34.5"/>
    <rect class="ei-box" x="46" y="45" width="7" height="7" rx="2"/>
    <line class="ei-line" x1="58" y1="48.5" x2="70" y2="48.5"/>
    <rect class="ei-box" x="46" y="59" width="7" height="7" rx="2"/>
    <line class="ei-line" x1="58" y1="62.5" x2="67" y2="62.5"/>
    <!-- plus badge -->
    <circle class="ei-badge" cx="80" cy="68" r="12"/>
    <line class="ei-plus" x1="80" y1="62.5" x2="80" y2="73.5"/>
    <line class="ei-plus" x1="74.5" y1="68" x2="85.5" y2="68"/>
  </svg>
</div>
